<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent Attire | All Orders</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body style="background:var(--background);">
    <header>
        <div class="container navbar">
            <a href="dashboard.html" class="logo">
                <img src="../images/logo.svg" alt="Rent Attire logo" width="30" height="30">
                Rent Attire
            </a>
            <nav class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="shops.html">Shops</a>
                <a href="products.html">Products</a>
                <a href="orders.html" style="color:var(--gold);">Orders</a>
                <a href="users.html">Users</a>
                <a href="faqs.html">FAQs</a>
            </nav>
            <div class="nav-icons">
                <a href="../index.html" class="btn btn-outline" style="padding: 6px 12px; font-size: 0.85rem; box-shadow: none;">Visit Site</a>
                <a href="../index.html" data-signout style="margin-left: 10px;">Sign out</a>
            </div>
        </div>
    </header>

    <section class="section">
        <div class="container">
            <h1 class="mb-4">All Platform Orders</h1>
            <div class="card" style="padding: 0; overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead>
                        <tr style="background: #f9f9f9; border-bottom: 2px solid #eee;">
                            <th style="padding: 12px;">Order ID</th>
                            <th style="padding: 12px;">Customer</th>
                            <th style="padding: 12px;">Rental total</th>
                            <th style="padding: 12px;">Deposit</th>
                            <th style="padding: 12px;">Grand total</th>
                            <th style="padding: 12px;">Status</th>
                            <th style="padding: 12px;">Update Status</th>
                        </tr>
                    </thead>
                    <tbody id="adminOrdersBody"><tr><td colspan="6">Loading…</td></tr></tbody>
                </table>
            </div>
        </div>
    </section>

    <script src="../js/script.js"></script>
</body>
</html>
