<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent Attire | Admin Login</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body style="background:var(--background);">
    <section class="section" style="min-height: 100vh; display:flex; align-items:center;">
        <div class="container" style="max-width:400px;">
            <div class="text-center mb-4">
                <img src="../images/logo-full.svg" alt="Rent Attire" style="height: 60px; margin: 0 auto 16px;">
                <h1 style="color:var(--primary); font-family:var(--font-heading);">Admin Portal</h1>
            </div>
            <div class="card p-4">
                <form id="adminLoginForm">
                    <div class="form-group mb-3">
                        <label>Admin Email</label>
                        <input type="email" id="adminEmail" class="form-control" required>
                    </div>
                    <div class="form-group mb-4">
                        <label>Password</label>
                        <input type="password" id="adminPassword" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%">Secure Login</button>
                </form>
            </div>
        </div>
    </section>
<script src="../js/script.js"></script>
    <script>
        document.getElementById("adminLoginForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            try {
                const result = await api("login", { body: {
                    email: document.getElementById("adminEmail").value.trim(),
                    password: document.getElementById("adminPassword").value
                }});
                if (!result.success) { alert(result.message); return; }
                if (result.user.role !== "admin") {
                    await api("logout", { method: "POST" });
                    alert("This portal is for administrators only.");
                    return;
                }
                window.location.href = "dashboard.html";
            } catch (error) {
                alert("Could not reach the server. Is WAMP running?");
            }
        });
    </script>
</body>
</html>
