<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent Attire | Admin Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body style="background:var(--background);">
    <header>
        <div class="container navbar">
            <a href="dashboard.html" class="logo">
                <img src="../images/logo.svg" alt="Rent Attire logo" width="30" height="30">
                Rent Attire
            </a>
            <nav class="nav-links">
                <a href="dashboard.html" style="color:var(--gold);">Dashboard</a>
                <a href="shops.html">Manage Shops</a>
                <a href="orders.html">All Orders</a>
            </nav>
            <div class="nav-icons">
                <a href="../index.html" class="btn btn-outline" style="padding: 6px 12px; font-size: 0.85rem; box-shadow: none;">Visit Site</a>
                <a href="../index.html" data-signout style="margin-left: 10px;">Sign out</a>
            </div>
        </div>
    </header>

    <section class="section">
        <div class="container">
            <h1 class="mb-4">Platform Overview</h1>
            
            <div class="grid-3 mb-4">
                <div class="card p-4 text-center">
                    <h3 class="text-muted mb-2">Total Shops</h3>
                    <div id="adminShopCount" style="font-size:2rem; font-weight:bold; color:var(--primary);">—</div>
                </div>
                <div class="card p-4 text-center">
                    <h3 class="text-muted mb-2">Rental Volume</h3>
                    <div id="adminRentalVolume" style="font-size:2rem; font-weight:bold; color:var(--primary);">—</div>
                </div>
                <div class="card p-4 text-center">
                    <h3 class="text-muted mb-2">Active Orders</h3>
                    <div id="adminActiveOrders" style="font-size:2rem; font-weight:bold; color:var(--primary);">—</div>
                </div>
            </div>
            <div class="grid-3">
                <div class="card p-4 text-center"><h3 class="text-muted mb-2">Vendors</h3><div id="adminVendorCount" style="font-size:2rem;font-weight:bold;color:var(--primary);">—</div></div>
                <div class="card p-4 text-center"><h3 class="text-muted mb-2">Pending Vendor Approval</h3><div id="adminPendingVendors" style="font-size:2rem;font-weight:bold;color:var(--primary);">—</div></div>
                <div class="card p-4 text-center"><h3 class="text-muted mb-2">Products</h3><div id="adminProductCount" style="font-size:2rem;font-weight:bold;color:var(--primary);">—</div></div>
            </div>
        </div>
    </section>

    <script src="../js/script.js"></script>
</body>
</html>
