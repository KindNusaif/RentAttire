<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Collection | Rent Attire</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container navbar">
            <a href="index.html" class="logo">Rent Attire</a>
            <button class="hamburger" id="hamburger">☰</button>
            <nav class="nav-links" id="navLinks">
                <a href="index.html">Home</a>
                <a href="products.html">Collection</a>
                <a href="shops.html">Shops</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </nav>
            <div class="nav-icons">
                <a href="vendor-register.html" class="btn btn-primary" style="padding: 8px 16px; font-size: 0.85rem; box-shadow: none;">List Your Shop</a>
                <a href="cart.html">Cart <span id="cartCount" class="badge badge-available">0</span></a>
                <a href="login.html">Login</a>
            </div>
        </div>
    </header>

    <section class="section">
        <div class="container">
            <h1 class="section-title">Our Collection</h1>
            
            <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:20px; margin-bottom:40px;">
                <div style="flex:1; min-width:200px;">
                    <input type="text" id="searchInput" class="form-control" placeholder="Search attire..." onkeyup="filterProducts()">
                </div>
                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                    <select id="categoryFilter" class="form-control" onchange="filterProducts()">
                        <option value="All">All Categories</option>
                        <option value="Sarees">Sarees</option>
                        <option value="Bridal Wear">Bridal Wear</option>
                        <option value="Suits">Suits</option>
                        <option value="Dresses">Dresses</option>
                    </select>
                    <select id="sortFilter" class="form-control" onchange="filterProducts()">
                        <option value="default">Default Sorting</option>
                        <option value="priceLowHigh">Price: Low to High</option>
                        <option value="priceHighLow">Price: High to Low</option>
                        <option value="nameAZ">Name: A-Z</option>
                    </select>
                </div>
            </div>

            <p id="resultsCount" class="text-muted mb-3">Showing all attire</p>

            <div class="grid-3" id="productsContainer">
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container text-center">
            <p>&copy; 2026 RentAttire. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const container = document.getElementById("productsContainer");
            container.innerHTML = "<p>Loading...</p>";
            const products = await loadProducts();
            if (!products.length) {
                container.innerHTML = "<p>No products available yet.</p>";
                return;
            }
            container.innerHTML = products.map(p => `
                <div class="card product-card" data-product-id="${p.id}" data-category="${escapeHtml(p.category)}" data-price="${p.price}" data-name="${escapeHtml(p.name)}">
                    <div class="card-img"><img src="${escapeHtml(p.image)}" alt="${escapeHtml(p.name)}"></div>
                    <div class="card-body">
                        <span class="badge ${p.availability === "Available" ? "badge-available" : p.availability === "Limited" ? "badge-limited" : "badge-unavailable"} mb-2">${p.availability}</span>
                        <p style="font-size:12px; color:var(--muted)">${escapeHtml(p.category)} &middot; <a href="shop-profile.html?id=${p.shopId}" style="color:inherit; text-decoration:none;">${escapeHtml(p.shopName)}</a></p>
                        <h3 class="card-title">${escapeHtml(p.name)}</h3>
                        <div class="price">Rs. ${p.price.toLocaleString()} / day</div>
                        <a href="product-details.html?id=${p.id}" class="btn btn-outline" style="width:100%">View Details</a>
                    </div>
                </div>`).join("");
            wireProductCards();
            filterProducts();
        });
        function filterProducts() {
            const search = document.getElementById("searchInput").value.toLowerCase();
            const category = document.getElementById("categoryFilter").value;
            const sort = document.getElementById("sortFilter").value;
            
            const container = document.getElementById("productsContainer");
            const cards = Array.from(container.getElementsByClassName("product-card"));
            
            cards.forEach(card => {
                const name = card.getAttribute("data-name").toLowerCase();
                const cardCat = card.getAttribute("data-category");
                
                const matchesSearch = name.includes(search);
                const matchesCategory = category === "All" || cardCat === category;
                
                if(matchesSearch && matchesCategory) {
                    card.style.display = "flex";
                } else {
                    card.style.display = "none";
                }
            });
            
            // Simple sorting logic
            const visibleCards = cards.filter(card => card.style.display !== "none");
            if (sort !== "default") {
                visibleCards.sort((a, b) => {
                    const priceA = parseInt(a.getAttribute("data-price"));
                    const priceB = parseInt(b.getAttribute("data-price"));
                    const nameA = a.getAttribute("data-name");
                    const nameB = b.getAttribute("data-name");
                    if(sort === "priceLowHigh") return priceA - priceB;
                    if(sort === "priceHighLow") return priceB - priceA;
                    if(sort === "nameAZ") return nameA.localeCompare(nameB);
                    return 0;
                });
                
                visibleCards.forEach(card => container.appendChild(card)); // Re-append in sorted order
            }

            // Update the "Showing X items" text
            const resultsCount = document.getElementById("resultsCount");
            if (resultsCount) {
                resultsCount.textContent = visibleCards.length === cards.length
                    ? "Showing all " + cards.length + " items"
                    : "Showing " + visibleCards.length + " of " + cards.length + " items";
            }
        }

        document.addEventListener("DOMContentLoaded", filterProducts);
    </script>
</body>
</html>
