<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent Attire | Vendor Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background:var(--background);">
    <header>
        <div class="container navbar">
            <a href="vendor-dashboard.html" class="logo">
                <img src="images/logo.svg" alt="Rent Attire logo" width="30" height="30">
                Rent Attire
            </a>
            <nav class="nav-links">
                <a href="vendor-dashboard.html" style="color:var(--gold);">Dashboard</a>
                <a href="vendor-products.html">My Products</a>
                <a href="vendor-orders.html">Orders</a>
                <a href="vendor-profile.html">Profile</a>
            </nav>
            <div class="nav-icons">
                <a href="index.html" class="btn btn-outline" style="padding: 6px 12px; font-size: 0.85rem; box-shadow: none;">View Store</a>
                <a href="#" data-signout style="margin-left: 10px;">Sign out</a>
            </div>
        </div>
    </header>

    <section class="section">
        <div class="container">
            <h1 id="vendorWelcome" class="mb-4">Vendor Dashboard</h1>
            <p id="vendorApprovalNotice" class="card p-3 mb-4" role="status" hidden></p>
            
            <div class="grid-3 mb-4">
                <div class="card p-4 text-center">
                    <h3 class="text-muted mb-2">Total Earnings</h3>
                    <div id="vendorEarnings" style="font-size:2rem; font-weight:bold; color:var(--primary);">—</div>
                </div>
                <div class="card p-4 text-center">
                    <h3 class="text-muted mb-2">Total Orders</h3>
                    <div id="vendorOrdersCount" style="font-size:2rem; font-weight:bold; color:var(--primary);">—</div>
                </div>
                <div class="card p-4 text-center">
                    <h3 class="text-muted mb-2">Products Listed</h3>
                    <div id="vendorProductsCount" style="font-size:2rem; font-weight:bold; color:var(--primary);">—</div>
                </div>
            </div>
            <div class="grid-2 mb-4">
                <div class="card p-4 text-center"><h3 class="text-muted mb-2">Pending Requests</h3><div id="vendorPendingCount" style="font-size:2rem;font-weight:bold;color:var(--primary);">—</div></div>
                <div class="card p-4 text-center"><h3 class="text-muted mb-2">Active Rentals</h3><div id="vendorActiveCount" style="font-size:2rem;font-weight:bold;color:var(--primary);">—</div></div>
            </div>
            <div class="card p-4" style="overflow-x:auto;">
                <h2 class="mb-3">Recent Orders</h2>
                <table style="width:100%;border-collapse:collapse;text-align:left;">
                    <thead><tr><th>Order</th><th>Product</th><th>Customer</th><th>Rental dates</th><th>Status</th></tr></thead>
                    <tbody id="vendorRecentOrders"><tr><td colspan="5">Loading…</td></tr></tbody>
                </table>
            </div>
        </div>
    </section>

    <script src="js/script.js"></script>
</body>
</html>
